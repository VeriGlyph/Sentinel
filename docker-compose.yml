services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: veriglyph
      POSTGRES_PASSWORD: veriglyph
      POSTGRES_DB: veriglyph_indexer
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://veriglyph:veriglyph@db:5432/veriglyph_indexer}
      BLOCKFROST_PROJECT_ID: ${BLOCKFROST_PROJECT_ID}
      BLOCKFROST_NETWORK: ${BLOCKFROST_NETWORK:-preprod}
      BLOCKFROST_START_HEIGHT: ${BLOCKFROST_START_HEIGHT:-761976}
      BLOCKFROST_RATE_LIMIT: ${BLOCKFROST_RATE_LIMIT:-10}
      BLOCKFROST_PAGE_SIZE: ${BLOCKFROST_PAGE_SIZE:-50}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-5000}
      TIP_POLL_INTERVAL_MS: ${TIP_POLL_INTERVAL_MS:-60000}
      PORT: 3000
    expose:
      - "3000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`${DOMAIN:-localhost}`) && (PathPrefix(`/certificates`) || PathPrefix(`/api`))
      - traefik.http.routers.api.entrypoints=web,websecure
      - traefik.http.routers.api.tls=${TRAEFIK_ENABLE_TLS:-false}
      - traefik.http.routers.api.tls.certresolver=${TRAEFIK_ENABLE_TLS:+le}
      - traefik.http.services.api.loadbalancer.server.port=3000
      - traefik.http.services.api.loadbalancer.server.scheme=http

  frontend:
    build:
      context: ./frontend
      args:
        VITE_NETWORK: ${VITE_NETWORK:-preprod}
    restart: unless-stopped
    environment:
      VITE_NETWORK: ${VITE_NETWORK:-preprod}
    expose:
      - "80"
    labels:
      - traefik.enable=true
      - traefik.http.routers.front.rule=Host(`${DOMAIN:-localhost}`)
      - traefik.http.routers.front.entrypoints=web,websecure
      - traefik.http.routers.front.tls=${TRAEFIK_ENABLE_TLS:-false}
      - traefik.http.routers.front.tls.certresolver=${TRAEFIK_ENABLE_TLS:+le}
      - traefik.http.services.front.loadbalancer.server.port=80
      - traefik.http.services.front.loadbalancer.server.scheme=http

  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    environment:
      - DOCKER_API_VERSION=1.44
    command:
      - --providers.docker=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.email=${LE_EMAIL:-you@example.com}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-data:/letsencrypt
volumes:
  pgdata:
  traefik-data:
